<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>

    <link rel="shortcut icon" href="./assets/icons/favicon.svg" type="image/x-icon">

    <link rel="stylesheet" href="./variables.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./utility.css">

    <script src="./script.js" defer></script>
    <script src="./templates.js" defer></script>
</head>

<body onload="init()">
    <header class="site-headline">
        <img class="site-headline__logo" src="./assets/icons/logo.svg" alt="Fotogram">
    </header>

    <main class="main-content">
        <h1 class="main-content__header" id="mainContentHeader">
            Dein persönliches Fotoalbum
        </h1>

        <ul class="picture-gallery" id="pictureGallery">
        </ul>
    </main>

    <footer class="site-footer">
        <svg class="site-footer__curve" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true">
            <path d="M 0 4 Q 50 -4 100 4 L 100 24 L 0 24 Z" />
        </svg>

        <img class="site-footer__logo" src="./assets/icons/da_logo.png" alt="">
        <p class="site-footer__copyright">© 2023 Developer Akademie GmbH</p>
    </footer>

    <dialog class="photo-overlay" id="photoOverlay">
    </dialog>
</body>

</html>
